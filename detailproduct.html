<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            /* ===== NỀN TỐI ĐỒNG BỘ VỚI TRANG CHỦ ===== */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.7),
                    rgba(0, 0, 0, 0.7)
                ),
                url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDDBvYB3gSYmtditkezzHxvCUpZb88PMWz15Y6a3IeVA&s=10");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #fff; /* Chữ trắng */
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== HEADER TỐI ===== */
        .header {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            padding: 0 20px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #4da3ff, #007bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .logo span {
            -webkit-text-fill-color: #007bff;
        }
        .header .back-link {
            color: #ccc;
            font-weight: 500;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }
        .header .back-link:hover {
            color: #4da3ff;
        }

        /* ===== PRODUCT DETAIL (NỀN TỐI) ===== */
        .product-detail {
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 30px;
            margin: 40px 0;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            border: 1px solid #333;
        }
        .product-detail .image {
            flex: 1 1 300px;
            background: #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .product-detail .image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 400px;
        }
        .product-detail .info {
            flex: 2 1 400px;
        }
        .product-detail .info h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .product-detail .info .price {
            font-size: 24px;
            font-weight: 700;
            color: #4da3ff;
            margin-bottom: 15px;
        }
        .product-detail .info .stock {
            font-size: 16px;
            margin-bottom: 15px;
        }
        .product-detail .info .stock .in-stock {
            color: #2ecc71;
            font-weight: 600;
        }
        .product-detail .info .stock .out-of-stock {
            color: #e74c3c;
            font-weight: 600;
        }
        .product-detail .info .stock .no-stock-info {
            color: #888;
            font-weight: 600;
        }
        .product-detail .info .specs {
            margin-bottom: 15px;
            font-size: 15px;
            color: #aaa;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }
        .product-detail .info .description {
            margin-bottom: 20px;
            font-size: 15px;
            color: #aaa;
            line-height: 1.8;
        }

        /* ===== REVIEW SECTION (NỀN TỐI) ===== */
        .review-section {
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 30px;
            margin: 40px 0;
            border: 1px solid #333;
        }
        .review-section h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }
        .review-summary {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .review-summary .avg-rating {
            font-size: 32px;
            font-weight: 700;
            color: #4da3ff;
        }
        .review-summary .total-reviews {
            font-size: 16px;
            color: #aaa;
        }
        .review-item {
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .review-item .rating {
            color: #f59e0b;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .review-item .comment {
            font-size: 15px;
            color: #fff;
            margin-bottom: 5px;
        }
        .review-item .time {
            font-size: 13px;
            color: #888;
        }
        .review-pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .review-pagination button {
            padding: 6px 14px;
            border: 2px solid #555;
            background: #1e1e1e;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #ccc;
        }
        .review-pagination button:hover {
            border-color: #4da3ff;
            color: #4da3ff;
        }
        .review-pagination button.active {
            background: #4da3ff;
            border-color: #4da3ff;
            color: #fff;
        }
        .review-pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .no-reviews {
            text-align: center;
            color: #888;
            padding: 30px 0;
            font-size: 16px;
        }

        /* ===== LOADING & ERROR ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: #888;
        }
        .loading .spinner {
            border: 4px solid #333;
            border-top: 4px solid #4da3ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            background: #fee;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 40px 0;
            border: 1px solid #f5c6cb;
        }

        /* ===== FOOTER (NỀN TỐI) ===== */
        .footer {
            background: #0d0d0d;
            color: #ccc;
            padding: 40px 20px 20px;
            margin-top: 40px;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
        }
        .footer-content h4 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .footer-content p,
        .footer-content li {
            font-size: 14px;
            opacity: 0.8;
            list-style: none;
            margin-bottom: 6px;
        }
        .footer-content li a:hover {
            opacity: 1;
            color: #4da3ff;
        }
        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #333;
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
        @media (max-width: 768px) {
            .product-detail {
                flex-direction: column;
                padding: 20px;
            }
            .product-detail .info h1 {
                font-size: 24px;
            }
            .product-detail .info .price {
                font-size: 20px;
            }
            .review-summary {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">My<span>Shop</span></div>
        <a href="index.html" class="back-link">← Quay lại trang chủ</a>
    </header>

    <div class="container">
        <div id="productDetailContainer">
            <div class="loading"><div class="spinner"></div>Đang tải chi tiết sản phẩm...</div>
        </div>
        <!-- Review Section -->
        <div id="reviewContainer" style="display: none;">
            <div class="review-section">
                <h2>⭐ Đánh giá sản phẩm</h2>
                <div id="reviewSummary" class="review-summary"></div>
                <div id="reviewList"></div>
                <div id="reviewPagination" class="review-pagination"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div><h4>MyShop</h4><p>Mua sắm trực tuyến hàng đầu Việt Nam.</p></div>
            <div><h4>Liên kết</h4><ul><li><a href="#">Giới thiệu</a></li><li><a href="#">Chính sách</a></li><li><a href="#">Hỗ trợ</a></li></ul></div>
            <div><h4>Liên hệ</h4><p>Email: support@myshop.vn</p><p>Hotline: 1900 1234</p></div>
        </div>
        <div class="footer-bottom">&copy; 2026 MyShop. All rights reserved.</div>
    </footer>

    <!-- GIỮ NGUYÊN TOÀN BỘ LOGIC JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        const API_BASE_URL = 'https://hoang89computer-be.onrender.com';
        const WS_ENDPOINT = 'https://hoang89computer-be.onrender.com/ws';
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Stock + WebSocket variables
        let stompClient = null;
        let inventoryId = null;
        let currentStock = 0;
        let currentProductName = '';

        // Review variables
        let reviewCurrentPage = 0;
        let reviewTotalPages = 1;

        // DOM elements
        const reviewContainer = document.getElementById('reviewContainer');
        const reviewSummary = document.getElementById('reviewSummary');
        const reviewList = document.getElementById('reviewList');
        const reviewPagination = document.getElementById('reviewPagination');

        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error?.message || error?.result?.message || `HTTP ${response.status}`);
            }
            const data = await response.json();
            return data?.result || data;
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        }

        function getStockText(stock) {
            if (stock === null || stock === undefined) return `<span class="no-stock-info">⏳ Chưa cập nhật tồn kho</span>`;
            return stock > 0 ? `<span class="in-stock">✅ Còn ${stock} sản phẩm</span>` : `<span class="out-of-stock">❌ Hết hàng</span>`;
        }

        function updateStockDisplay(stock) {
            const stockElement = document.getElementById('stockDisplay');
            if (!stockElement) return;
            currentStock = stock;
            stockElement.innerHTML = getStockText(stock);
        }

        // =========================
        // WebSocket
        // =========================
        function subscribeToInventory(invId) {
            if (!stompClient || !stompClient.connected) {
                console.warn('⚠️ STOMP not connected, cannot subscribe.');
                return;
            }
            const topic = `/topic/inventory/${invId}`;
            stompClient.subscribe(topic, function(message) {
                try {
                    const data = JSON.parse(message.body);
                    console.log('📦 Stock update received:', data);
                    if (data.stockQuantity !== undefined) {
                        updateStockDisplay(data.stockQuantity);
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            });
            console.log('✅ Subscribed to:', topic);
        }

        function connectWebSocket(invId) {
            if (!invId) {
                console.warn('⚠️ No inventoryId, skip WebSocket.');
                return;
            }
            if (stompClient && stompClient.connected) {
                subscribeToInventory(invId);
                return;
            }
            if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') {
                console.warn('⚠️ WebSocket libraries not loaded.');
                return;
            }

            try {
                const socket = new SockJS(WS_ENDPOINT);
                stompClient = Stomp.over(socket);
                stompClient.debug = function(str) {};

                stompClient.connect({}, function(frame) {
                    console.log('🔌 WebSocket connected:', frame);
                    subscribeToInventory(invId);
                }, function(error) {
                    console.error('❌ WebSocket error:', error);
                    setTimeout(() => {
                        if (inventoryId) connectWebSocket(inventoryId);
                    }, 5000);
                });
            } catch (e) {
                console.error('❌ SockJS error:', e);
            }
        }

        // =========================
        // Reviews
        // =========================
        function renderStars(rating) {
            const full = '★'.repeat(Math.floor(rating));
            const half = rating % 1 >= 0.5 ? '½' : '';
            const empty = '☆'.repeat(5 - Math.floor(rating) - (rating % 1 >= 0.5 ? 1 : 0));
            return full + half + empty;
        }

        function renderReviews(reviews, totalPages, currentPage) {
            if (!reviews || reviews.length === 0) {
                reviewList.innerHTML = '<div class="no-reviews">Chưa có đánh giá nào cho sản phẩm này.</div>';
                reviewPagination.innerHTML = '';
                reviewSummary.innerHTML = '<div class="total-reviews">Chưa có đánh giá</div>';
                return;
            }

            const total = reviews.length;
            const avg = (reviews.reduce((sum, r) => sum + r.rating, 0) / total).toFixed(1);
            reviewSummary.innerHTML = `
                <div class="avg-rating">⭐ ${avg} / 5</div>
                <div class="total-reviews">${total} đánh giá</div>
            `;

            reviewList.innerHTML = reviews.map(r => `
                <div class="review-item">
                    <div class="rating">${renderStars(r.rating)} (${r.rating}/5)</div>
                    <div class="comment">${r.comment || 'Không có bình luận'}</div>
                    <div class="time">${new Date(r.createdAt).toLocaleDateString('vi-VN')}</div>
                </div>
            `).join('');

            if (totalPages <= 1) {
                reviewPagination.innerHTML = '';
                return;
            }

            let paginationHtml = '';
            paginationHtml += `<button ${currentPage === 0 ? 'disabled' : ''} onclick="loadReviews(${currentPage - 1})">‹</button>`;
            for (let i = 0; i < totalPages; i++) {
                paginationHtml += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadReviews(${i})">${i + 1}</button>`;
            }
            paginationHtml += `<button ${currentPage >= totalPages - 1 ? 'disabled' : ''} onclick="loadReviews(${currentPage + 1})">›</button>`;
            reviewPagination.innerHTML = paginationHtml;
        }

        async function loadReviews(page = 0) {
            try {
                const data = await fetchData(`${API_BASE_URL}/api/reviews/product/${productId}?page=${page}&size=5`);
                const content = data?.content || [];
                const totalPages = data?.totalPages || 1;
                const current = data?.number || 0;
                reviewCurrentPage = current;
                reviewTotalPages = totalPages;

                if (content.length === 0 && totalPages === 0) {
                    reviewContainer.style.display = 'block';
                    reviewSummary.innerHTML = '<div class="total-reviews">Chưa có đánh giá</div>';
                    reviewList.innerHTML = '<div class="no-reviews">Chưa có đánh giá nào cho sản phẩm này.</div>';
                    reviewPagination.innerHTML = '';
                    return;
                }

                renderReviews(content, totalPages, current);
                reviewContainer.style.display = 'block';
            } catch (error) {
                console.error('Load reviews error:', error);
                reviewContainer.style.display = 'block';
                reviewList.innerHTML = `<div class="error-msg">❌ ${error.message}</div>`;
            }
        }

        // =========================
        // Product Detail
        // =========================
        async function loadDetail(id) {
            const container = document.getElementById('productDetailContainer');
            try {
                const product = await fetchData(`${API_BASE_URL}/api/products/${id}/detailproduct`);
                if (!product) throw new Error('Không tìm thấy sản phẩm.');
                currentProductName = product.nameProduct;

                let inventory = null;
                let inventoryError = false;
                try {
                    const invResponse = await fetch(`${API_BASE_URL}/api/inventory/${id}/user`);
                    if (invResponse.ok) {
                        const data = await invResponse.json();
                        inventory = data?.result || data;
                    } else {
                        throw new Error(`HTTP ${invResponse.status}`);
                    }
                } catch (invErr) {
                    inventoryError = true;
                    console.warn('⚠️ No inventory for product ID:', id);
                }

                let stock = 0;
                let invId = null;
                if (inventory && !inventoryError) {
                    stock = inventory.soluong ?? 0;
                    invId = inventory.id;
                } else {
                    stock = null;
                    invId = null;
                }
                currentStock = stock;
                inventoryId = invId;

                const imageHtml = product.image ? `<img src="${product.image}" alt="${product.nameProduct}" />` : '📦';

                container.innerHTML = `
                    <div class="product-detail">
                        <div class="image">${imageHtml}</div>
                        <div class="info">
                            <h1>${product.nameProduct}</h1>
                            <div class="price">${formatPrice(product.price)}</div>
                            <div class="stock" id="stockDisplay">${getStockText(stock)}</div>
                            ${product.specs ? `<div class="specs"><strong>Thông số:</strong> ${product.specs}</div>` : ''}
                            ${product.description ? `<div class="description"><strong>Mô tả:</strong> ${product.description}</div>` : ''}
                        </div>
                    </div>
                `;

                if (inventoryId) {
                    connectWebSocket(inventoryId);
                }

                await loadReviews(0);

            } catch (error) {
                container.innerHTML = `<div class="error-msg">❌ ${error.message}</div>`;
                console.error(error);
            }
        }

        if (productId) {
            loadDetail(productId);
        } else {
            document.getElementById('productDetailContainer').innerHTML =
                `<div class="error-msg">⚠️ Không tìm thấy ID sản phẩm.</div>`;
            reviewContainer.style.display = 'none';
        }
    </script>
</body>
</html>
