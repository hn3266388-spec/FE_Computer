<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ của tôi - MyShop</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        
        /* ===== NỀN TỐI ĐỒNG BỘ VỚI TRANG CHỦ ===== */
        body {
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.7),
                    rgba(0, 0, 0, 0.7)
                ),
                url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDDBvYB3gSYmtditkezzHxvCUpZb88PMWz15Y6a3IeVA&s=10");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #fff; /* Chữ trắng */
        }
        .container { max-width:1200px; margin:0 auto; padding:0 20px; }
        a { text-decoration:none; color:inherit; }

        /* ===== HEADER TỐI ===== */
        .header {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            padding:0 20px; height:72px; display:flex; align-items:center;
            justify-content:space-between; position:sticky; top:0; z-index:1000;
        }
        .header .logo { 
            font-size:26px; font-weight:800; 
            background:linear-gradient(135deg,#4da3ff,#007bff); 
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; 
        }
        .header .logo span { -webkit-text-fill-color:#007bff; }
        .header .nav-links { display:flex; gap:20px; align-items:center; flex:1; margin-left:30px; }
        .header .nav-links a { color:#ccc; font-weight:500; font-size:15px; transition:color 0.2s; }
        .header .nav-links a:hover { color:#4da3ff; }
        .header .nav-links .cart-link { position:relative; font-size:20px; margin-left:auto; }
        .header .nav-links .cart-link .badge {
            position:absolute; top:-8px; right:-12px; background:#e74c3c; color:#fff;
            font-size:11px; border-radius:50%; padding:2px 6px; min-width:18px; text-align:center;
        }
        .header .user-section { display:flex; align-items:center; gap:12px; margin-left:20px; }
        .header .user-info { display:flex; align-items:center; gap:8px; font-weight:500; color:#fff; }
        .header .user-info .avatar {
            width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#4da3ff,#007bff);
            color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; text-transform:uppercase;
        }
        .header .user-info .username { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .header .btn-logout { background:linear-gradient(135deg,#ff4d4d,#e74c3c); color:#fff; border:none; padding:6px 16px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; transition:background 0.2s; }
        .header .btn-logout:hover { background:linear-gradient(135deg,#ff3333,#c0392b); }
        .header .auth-links { display:flex; gap:10px; align-items:center; }
        .header .auth-links .btn { padding:6px 16px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; transition:all 0.25s; border:none; text-decoration:none; }
        .header .auth-links .btn-outline { background:transparent; border:2px solid #4da3ff; color:#4da3ff; }
        .header .auth-links .btn-outline:hover { background:#4da3ff; color:#fff; }
        .header .auth-links .btn-primary { background:linear-gradient(135deg,#4da3ff,#007bff); color:#fff; }
        .header .auth-links .btn-primary:hover { transform:scale(1.04); box-shadow:0 8px 24px rgba(77,163,255,0.35); }

        /* ===== PROFILE (NỀN TỐI) ===== */
        .profile-section {
            background: #1e1e1e;
            border-radius:20px; box-shadow:0 4px 20px rgba(0,0,0,0.4);
            padding:30px; margin:40px 0; border:1px solid #333;
        }
        .profile-section h2 { font-size:28px; font-weight:700; margin-bottom:24px; color:#fff; border-bottom:2px solid #333; padding-bottom:16px; }
        .profile-grid { display:grid; grid-template-columns:1fr 2fr; gap:30px; }
        @media (max-width:768px) { .profile-grid { grid-template-columns:1fr; } }

        .profile-info { background:#2a2a2a; padding:20px; border-radius:12px; border:1px solid #444; }
        .profile-info .info-item { margin-bottom:12px; }
        .profile-info .info-item label { font-weight:600; color:#aaa; display:block; font-size:14px; }
        .profile-info .info-item .value { font-size:16px; color:#fff; font-weight:500; }

        /* ===== ADDRESS (NỀN TỐI) ===== */
        .address-list { margin-top:20px; }
        .address-item {
            background:#2a2a2a; border:1px solid #444; border-radius:10px;
            padding:16px; margin-bottom:12px;
            display:flex; justify-content:space-between; align-items:center;
            transition:border-color 0.2s;
        }
        .address-item:hover { border-color:#4da3ff; }
        .address-item .info { flex:1; }
        .address-item .info .name { font-weight:600; font-size:16px; color:#fff; }
        .address-item .info .detail { font-size:14px; color:#aaa; margin-top:4px; }
        .address-item .info .default-badge {
            display:inline-block; background:#4da3ff; color:#fff;
            font-size:12px; padding:2px 10px; border-radius:20px; margin-left:8px;
        }
        .address-item .actions { display:flex; gap:8px; }
        .address-item .actions button {
            padding:4px 14px; border:none; border-radius:6px; font-weight:600;
            cursor:pointer; transition:background 0.2s;
        }
        .address-item .actions .edit-btn { background:#4da3ff; color:#fff; }
        .address-item .actions .edit-btn:hover { background:#007bff; }
        .address-item .actions .delete-btn { background:#e74c3c; color:#fff; }
        .address-item .actions .delete-btn:hover { background:#c0392b; }

        .btn-add-address {
            padding:12px 24px; background:linear-gradient(135deg,#4da3ff,#007bff);
            color:#fff; border:none; border-radius:40px; font-weight:600;
            font-size:16px; cursor:pointer; transition:transform 0.2s;
            margin-top:10px;
        }
        .btn-add-address:hover { transform:scale(1.03); box-shadow:0 4px 12px rgba(77,163,255,0.4); }

        .btn-orders {
            padding:12px 24px; background:linear-gradient(135deg,#27ae60,#2ecc71);
            color:#fff; border:none; border-radius:40px; font-weight:600;
            font-size:16px; cursor:pointer; transition:transform 0.2s;
            margin-top:10px; margin-left:10px;
        }
        .btn-orders:hover { transform:scale(1.03); box-shadow:0 4px 12px rgba(46,204,113,0.4); }

        /* ===== MODAL (NỀN TỐI) ===== */
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
            z-index:999; justify-content:center; align-items:center; padding:20px;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background: #1e1e1e;
            border-radius:16px; padding:30px; max-width:480px;
            width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5);
            animation:modalIn 0.3s ease;
        }
        @keyframes modalIn { from { opacity:0; transform:scale(0.9) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal h3 { margin-bottom:20px; color:#fff; font-weight:600; font-size:22px; text-align:center; }
        .modal .form-group { margin-bottom:16px; }
        .modal .form-group label { display:block; font-weight:600; color:#aaa; font-size:14px; margin-bottom:4px; }
        .modal .form-group input, .modal .form-group textarea {
            width:100%; padding:10px 14px; border:2px solid #444;
            border-radius:8px; font-size:15px; background:#2a2a2a; color:#fff;
            transition:border-color 0.3s;
        }
        .modal .form-group input:focus, .modal .form-group textarea:focus {
            border-color:#4da3ff; outline:none; background:#333;
        }
        .modal .form-group textarea { resize:vertical; min-height:60px; }
        .modal .form-group .checkbox-group { display:flex; align-items:center; gap:10px; }
        .modal .form-group .checkbox-group input { width:auto; }
        .modal .btn-submit {
            width:100%; padding:12px; background:linear-gradient(135deg,#4da3ff,#007bff);
            color:#fff; border:none; border-radius:8px; font-weight:600; font-size:16px;
            cursor:pointer; transition:transform 0.2s;
        }
        .modal .btn-submit:hover { transform:scale(1.02); }
        .modal .btn-submit:disabled { background:#555; cursor:not-allowed; transform:none; }
        .modal .close-modal {
            float:right; background:none; border:none; font-size:24px;
            cursor:pointer; color:#888; transition:color 0.2s;
        }
        .modal .close-modal:hover { color:#fff; }
        .modal .modal-message { margin-top:12px; padding:10px; border-radius:6px; font-size:14px; display:none; }
        .modal .modal-message.error { background:#fee; color:#d32f2f; border:1px solid #f5c6cb; display:block; }
        .modal .modal-message.success { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9; display:block; }

        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:30px; right:30px; background:#2a2a2a; color:#fff; padding:16px 24px;
            border-radius:14px; font-weight:600; font-size:15px; box-shadow:0 8px 32px rgba(0,0,0,0.5);
            z-index:9999; opacity:0; transform:translateY(30px); transition:all 0.4s ease;
            border-left:5px solid #27ae60; max-width:400px; pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.error { border-left-color:#e74c3c; }

        /* ===== FOOTER (NỀN TỐI) ===== */
        .footer { background:#0d0d0d; color:#ccc; padding:50px 20px 30px; margin-top:60px; }
        .footer-content { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:40px; }
        .footer-content h4 { color:#fff; font-size:18px; margin-bottom:14px; font-weight:600; }
        .footer-content p, .footer-content li { font-size:14px; opacity:0.8; list-style:none; margin-bottom:8px; }
        .footer-content li a:hover { color:#4da3ff; }
        .footer-bottom { text-align:center; padding-top:24px; border-top:1px solid #333; margin-top:32px; font-size:14px; opacity:0.7; }
        
        .loading { text-align:center; padding:60px 20px; color:#888; font-size:18px; }
        .loading .spinner { border:4px solid #333; border-top:4px solid #4da3ff; border-radius:50%; width:44px; height:44px; animation:spin 0.9s linear infinite; margin:0 auto 16px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .error-msg { background:#fee; color:#d32f2f; padding:16px; border-radius:10px; text-align:center; margin:40px 0; border:1px solid #f5c6cb; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">My<span>Shop</span></div>
        <div class="nav-links">
            <a href="trangchu.html">Trang chủ</a>
            <a href="trangchu.html">Sản phẩm</a>
            <a href="cart.html" class="cart-link">
                🛒 <span class="badge" id="cartCount">0</span>
            </a>
            <div id="userSection" class="user-section"></div>
        </div>
    </header>

    <div class="container">
        <div class="profile-section">
            <h2>👤 Hồ sơ của tôi</h2>
            <div id="profileContainer">
                <div class="loading"><div class="spinner"></div>Đang tải thông tin...</div>
            </div>
        </div>
    </div>

    <!-- Modal thêm/sửa địa chỉ -->
    <div class="modal-overlay" id="addressModal">
        <div class="modal">
            <button class="close-modal" id="closeModal">&times;</button>
            <h3 id="modalTitle">Thêm địa chỉ mới</h3>
            <div class="form-group">
                <label for="modalFullName">Họ và tên</label>
                <input type="text" id="modalFullName" placeholder="Nhập họ tên" />
            </div>
            <div class="form-group">
                <label for="modalPhone">Số điện thoại</label>
                <input type="tel" id="modalPhone" placeholder="Nhập số điện thoại" />
            </div>
            <div class="form-group">
                <label for="modalAddress">Địa chỉ</label>
                <textarea id="modalAddress" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="modalDefault" />
                <label for="modalDefault">Đặt làm địa chỉ mặc định</label>
            </div>
            <button class="btn-submit" id="modalSubmitBtn">Lưu</button>
            <div id="modalMessage" class="modal-message"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div><h4>MyShop</h4><p>Mua sắm trực tuyến hàng đầu Việt Nam.</p></div>
            <div><h4>Liên kết</h4><ul><li><a href="#">Giới thiệu</a></li><li><a href="#">Chính sách</a></li><li><a href="#">Hỗ trợ</a></li></ul></div>
            <div><h4>Liên hệ</h4><p>Email: support@myshop.vn</p><p>Hotline: 1900 1234</p></div>
        </div>
        <div class="footer-bottom">&copy; 2026 MyShop. All rights reserved.</div>
    </footer>

    <div id="toast" class="toast"></div>

    <!-- GIỮ NGUYÊN TOÀN BỘ LOGIC JAVASCRIPT -->
    <script>
        const API_BASE_URL = 'https://hoang89computer-be.onrender.com';

        const profileContainer = document.getElementById('profileContainer');
        const cartCount = document.getElementById('cartCount');
        const userSection = document.getElementById('userSection');
        const toast = document.getElementById('toast');
        const addressModal = document.getElementById('addressModal');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalFullName = document.getElementById('modalFullName');
        const modalPhone = document.getElementById('modalPhone');
        const modalAddress = document.getElementById('modalAddress');
        const modalDefault = document.getElementById('modalDefault');
        const modalSubmitBtn = document.getElementById('modalSubmitBtn');
        const modalMessage = document.getElementById('modalMessage');

        let toastTimeout = null;
        let editingAddressId = null;
        let addresses = [];

        function showToast(msg, isError=false) {
            toast.innerHTML = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ========================= TOKEN =========================
        async function refreshAccessToken() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/account/refresh-token`, { method:'POST', credentials:'include' });
                if (!res.ok) throw new Error('Refresh failed');
                const data = await res.json();
                const token = data?.result?.accessToken || data?.accessToken;
                if (token) sessionStorage.setItem('accessToken', token);
                return token;
            } catch(e) { console.error(e); return null; }
        }
        async function getAccessToken() {
            let t = sessionStorage.getItem('accessToken');
            if (!t) t = await refreshAccessToken();
            return t;
        }

        async function fetchData(url, opts={}) {
            let token = await getAccessToken();
            if (!token) throw new Error('Không thể lấy access token. Vui lòng đăng nhập lại.');
            const headers = { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}`, ...(opts.headers||{}) };
            let res = await fetch(url, { ...opts, credentials:'include', headers });
            if (res.status===401 || res.status===403) {
                const newToken = await refreshAccessToken();
                if (newToken) {
                    headers['Authorization'] = `Bearer ${newToken}`;
                    res = await fetch(url, { ...opts, credentials:'include', headers });
                    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.message || e?.result?.message || `HTTP ${res.status}`); }
                    const data = await res.json();
                    return data?.result || data;
                } else {
                    sessionStorage.removeItem('accessToken');
                    window.location.href = 'dang-nhap.html';
                    throw new Error('Phiên đăng nhập hết hạn.');
                }
            }
            if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.message || e?.result?.message || `HTTP ${res.status}`); }
            const data = await res.json();
            return data?.result || data;
        }

        // ===== Auth & Header =====
        function getUserInfo() {
            try { return JSON.parse(sessionStorage.getItem('accountInfo')); } catch { return null; }
        }
        function renderHeader() {
            const user = getUserInfo();
            if (user?.accountname) {
                const initial = user.accountname.charAt(0).toUpperCase();
                userSection.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${initial}</div>
                        <span class="username">${user.accountname}</span>
                    </div>
                    <button class="btn-logout" id="logoutBtn">Đăng xuất</button>
                `;
                document.getElementById('logoutBtn')?.addEventListener('click', function() {
                    sessionStorage.removeItem('accountInfo');
                    sessionStorage.removeItem('accessToken');
                    localStorage.removeItem('cartCount');
                    window.location.href = 'dang-nhap.html';
                });
            } else {
                userSection.innerHTML = `
                    <div class="auth-links">
                        <a href="dang-nhap.html" class="btn btn-outline">Đăng nhập</a>
                        <a href="dang-ky.html" class="btn btn-primary">Đăng ký</a>
                    </div>
                `;
                window.location.href = 'dang-nhap.html';
            }
        }

        function updateCartCount() {
            const count = parseInt(localStorage.getItem('cartCount') || '0');
            cartCount.textContent = count;
        }

        // ===== Render Profile =====
        function renderProfile(user, addresses) {
            let addressHtml = addresses.map(addr => `
                <div class="address-item" data-id="${addr.id}">
                    <div class="info">
                        <div class="name">
                            ${addr.username}
                            ${addr.defaultaddress === 'true' || addr.defaultaddress === true ? '<span class="default-badge">Mặc định</span>' : ''}
                        </div>
                        <div class="detail">${addr.phone} - ${addr.address}</div>
                    </div>
                    <div class="actions">
                        <button class="edit-btn" onclick="editAddress(${addr.id})">Sửa</button>
                        <button class="delete-btn" onclick="deleteAddress(${addr.id})">Xóa</button>
                    </div>
                </div>
            `).join('');

            if (!addresses.length) {
                addressHtml = '<p style="color:#888; margin:10px 0;">Chưa có địa chỉ nào. Thêm địa chỉ mới.</p>';
            }

            const html = `
                <div class="profile-grid">
                    <div>
                        <h3 style="margin-bottom:16px; color:#fff;">Thông tin cá nhân</h3>
                        <div class="profile-info">
                            <div class="info-item">
                                <label>Họ và tên</label>
                                <div class="value">${user?.accountname || 'Chưa cập nhật'}</div>
                            </div>
                            <div class="info-item">
                                <label>Email</label>
                                <div class="value">${user?.gmail || 'Chưa cập nhật'}</div>
                            </div>
                            <div class="info-item">
                                <label>Vai trò</label>
                                <div class="value">${user?.role || 'USER'}</div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                            <h3 style="margin:0; color:#fff;">Sổ địa chỉ</h3>
                            <div>
                                <button class="btn-orders" onclick="window.location.href='order.html'">📦 Xem đơn hàng</button>
                                <button class="btn-orders" style="background:linear-gradient(135deg,#f39c12,#e67e22); margin-left:10px;" onclick="window.location.href='setpassword.html'">🔑 Đổi mật khẩu</button>
                            </div>
                        </div>
                        <div class="address-list">${addressHtml}</div>
                        <button class="btn-add-address" onclick="openAddAddressModal()">+ Thêm địa chỉ mới</button>
                    </div>
                </div>
            `;
            profileContainer.innerHTML = html;
        }

        // ===== Load Profile =====
        async function loadProfile() {
            try {
                const user = getUserInfo();
                const addrData = await fetchData(`${API_BASE_URL}/api/useraddresses/user`);
                addresses = addrData || [];
                renderProfile(user, addresses);
            } catch(e) {
                profileContainer.innerHTML = `<div class="error-msg">❌ ${e.message}</div>`;
                console.error(e);
            }
        }

        // ===== Modal Functions =====
        function openModal(title, address = null) {
            modalTitle.textContent = title;
            if (address) {
                editingAddressId = address.id;
                modalFullName.value = address.username || '';
                modalPhone.value = address.phone || '';
                modalAddress.value = address.address || '';
                modalDefault.checked = address.defaultaddress === 'true' || address.defaultaddress === true;
                modalSubmitBtn.textContent = 'Cập nhật';
            } else {
                editingAddressId = null;
                modalFullName.value = '';
                modalPhone.value = '';
                modalAddress.value = '';
                modalDefault.checked = false;
                modalSubmitBtn.textContent = 'Thêm mới';
            }
            modalMessage.className = 'modal-message';
            modalMessage.style.display = 'none';
            addressModal.classList.add('active');
        }

        window.openAddAddressModal = function() {
            openModal('Thêm địa chỉ mới');
        };

        window.editAddress = function(id) {
            const addr = addresses.find(a => a.id === id);
            if (addr) openModal('Sửa địa chỉ', addr);
        };

        closeModal.addEventListener('click', () => {
            addressModal.classList.remove('active');
        });
        addressModal.addEventListener('click', (e) => {
            if (e.target === addressModal) addressModal.classList.remove('active');
        });

        function showModalMessage(text, type) {
            modalMessage.textContent = text;
            modalMessage.className = 'modal-message ' + type;
            modalMessage.style.display = 'block';
        }

        // ===== Submit Address =====
        modalSubmitBtn.addEventListener('click', async function() {
            const username = modalFullName.value.trim();
            const phone = modalPhone.value.trim();
            const address = modalAddress.value.trim();
            const defaultaddress = modalDefault.checked ? 'true' : 'false';

            if (!username || !phone || !address) {
                showModalMessage('Vui lòng điền đầy đủ thông tin.', 'error');
                return;
            }

            const payload = {
                username,
                phone,
                address,
                defaultaddress
            };

            this.disabled = true;
            this.textContent = 'Đang xử lý...';
            modalMessage.style.display = 'none';

            try {
                let url = `${API_BASE_URL}/api/useraddresses/create`;
                let method = 'POST';
                if (editingAddressId) {
                    url = `${API_BASE_URL}/api/useraddresses/${editingAddressId}/update`;
                    method = 'PUT';
                }
                await fetchData(url, { method, body: JSON.stringify(payload) });
                showModalMessage('✅ Lưu địa chỉ thành công!', 'success');
                setTimeout(() => {
                    addressModal.classList.remove('active');
                    loadProfile();
                }, 1000);
            } catch (e) {
                showModalMessage(`❌ ${e.message}`, 'error');
                this.disabled = false;
                this.textContent = editingAddressId ? 'Cập nhật' : 'Thêm mới';
            }
        });

        // ===== Delete Address =====
        window.deleteAddress = async function(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa địa chỉ này?')) return;
            try {
                await fetchData(`${API_BASE_URL}/api/useraddresses/${id}/delete`, { method: 'DELETE' });
                showToast('✅ Đã xóa địa chỉ thành công.');
                loadProfile();
            } catch (e) {
                showToast(`❌ ${e.message}`, true);
            }
        };

        // ===== INIT =====
        async function init() {
            renderHeader();
            await getAccessToken();
            updateCartCount();
            loadProfile();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
