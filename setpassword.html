<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đổi mật khẩu - MyShop</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        body { background:#f4f6f9; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .container { background:#fff; border-radius:20px; padding:40px; max-width:450px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.1); }
        h2 { text-align:center; margin-bottom:24px; color:#2d3436; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-weight:600; color:#555; font-size:14px; margin-bottom:4px; }
        .form-group input { width:100%; padding:12px 16px; border:2px solid #e0e0e0; border-radius:10px; font-size:15px; transition:border-color 0.3s; background:#fafafa; }
        .form-group input:focus { border-color:#667eea; outline:none; background:#fff; }
        .btn-submit { width:100%; padding:14px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; border-radius:40px; font-weight:600; font-size:18px; cursor:pointer; transition:transform 0.2s; }
        .btn-submit:hover { transform:scale(1.02); }
        .btn-submit:disabled { background:#ccc; cursor:not-allowed; transform:none; }
        .btn-back { display:inline-block; margin-top:16px; padding:10px 24px; background:#95a5a6; color:#fff; border:none; border-radius:40px; font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; text-align:center; }
        .btn-back:hover { background:#7f8c8d; }
        .message { margin-top:12px; padding:10px; border-radius:6px; font-size:14px; display:none; }
        .message.error { background:#fee; color:#d32f2f; border:1px solid #f5c6cb; display:block; }
        .message.success { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9; display:block; }
        .info-text { background:#f0f4ff; padding:12px; border-radius:8px; margin-bottom:16px; color:#2c3e50; font-size:14px; border-left:4px solid #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔑 Đổi mật khẩu</h2>
        <div id="infoText" class="info-text">Đang kiểm tra thông tin...</div>
        <form id="changePasswordForm">
            <div id="oldPasswordGroup" class="form-group" style="display:none;">
                <label for="oldPassword">Mật khẩu cũ</label>
                <input type="password" id="oldPassword" placeholder="Nhập mật khẩu cũ" />
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" />
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Đổi mật khẩu</button>
        </form>
        <div id="message" class="message"></div>
        <a href="profile.html" class="btn-back" style="display:block; text-align:center;">← Quay lại hồ sơ</a>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';
        const infoText = document.getElementById('infoText');
        const oldPasswordGroup = document.getElementById('oldPasswordGroup');
        const messageEl = document.getElementById('message');

        // ========================= TOKEN =========================
        async function refreshAccessToken() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/account/refresh-token`, { method:'POST', credentials:'include' });
                if (!res.ok) throw new Error('Refresh failed');
                const data = await res.json();
                const token = data?.result?.accessToken || data?.accessToken;
                if (token) sessionStorage.setItem('accessToken', token);
                return token;
            } catch(e) { console.error(e); return null; }
        }
        async function getAccessToken() {
            let t = sessionStorage.getItem('accessToken');
            if (!t) t = await refreshAccessToken();
            return t;
        }

        async function fetchData(url, opts={}) {
            let token = await getAccessToken();
            if (!token) throw new Error('Không thể lấy access token. Vui lòng đăng nhập lại.');
            const headers = { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}`, ...(opts.headers||{}) };
            let res = await fetch(url, { ...opts, credentials:'include', headers });
            if (res.status===401 || res.status===403) {
                const newToken = await refreshAccessToken();
                if (newToken) {
                    headers['Authorization'] = `Bearer ${newToken}`;
                    res = await fetch(url, { ...opts, credentials:'include', headers });
                    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.message || e?.result?.message || `HTTP ${res.status}`); }
                    const data = await res.json();
                    return data?.result || data;
                } else {
                    sessionStorage.removeItem('accessToken');
                    window.location.href = 'dang-nhap.html';
                    throw new Error('Phiên đăng nhập hết hạn.');
                }
            }
            if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.message || e?.result?.message || `HTTP ${res.status}`); }
            const data = await res.json();
            return data?.result || data;
        }

        // ===== Kiểm tra xem tài khoản có mật khẩu không =====
        async function checkPasswordExists() {
            try {
                const result = await fetchData(`${API_BASE_URL}/api/account/check-password`, { method: 'GET' });
                const hasPassword = result?.hasPassword === true;

                if (hasPassword) {
                    infoText.innerHTML = '✅ Bạn đã có mật khẩu. Vui lòng nhập mật khẩu cũ để đổi mật khẩu mới.';
                    oldPasswordGroup.style.display = 'block';
                } else {
                    infoText.innerHTML = 'ℹ️ Bạn chưa có mật khẩu. Hãy tạo mật khẩu mới. (Không cần nhập mật khẩu cũ)';
                    oldPasswordGroup.style.display = 'none';
                }
                return hasPassword;
            } catch (e) {
                infoText.innerHTML = '❌ Không thể kiểm tra thông tin: ' + e.message;
                return false;
            }
        }

        // ===== Xử lý submit =====
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            messageEl.className = 'message';
            messageEl.style.display = 'none';

            if (!newPassword || newPassword.length < 6) {
                showMessage('Mật khẩu mới phải có ít nhất 6 ký tự.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('Mật khẩu xác nhận không khớp.', 'error');
                return;
            }

            // Kiểm tra xem có cần nhập mật khẩu cũ không
            const hasPassword = await checkPasswordExists(); // gọi lại để biết trạng thái hiện tại
            if (hasPassword && !oldPassword) {
                showMessage('Vui lòng nhập mật khẩu cũ.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            try {
                const body = new URLSearchParams();
                body.append('password', hasPassword ? oldPassword : '');
                body.append('newPassword', newPassword);

                await fetchData(`${API_BASE_URL}/api/account/set-gg-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });

                showMessage('✅ Đổi mật khẩu thành công!', 'success');
                // Chuyển về profile sau 2 giây
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 2000);
            } catch (e) {
                showMessage('❌ ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Đổi mật khẩu';
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
        }

        // ===== INIT =====
        checkPasswordExists();
    </script>
</body>
</html>
