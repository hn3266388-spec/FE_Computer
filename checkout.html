<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - MyShop</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        body { background:#f4f6f9; color:#2d3436; }
        .container { max-width:1200px; margin:0 auto; padding:0 20px; }
        a { text-decoration:none; color:inherit; }

        /* ===== HEADER ===== */
        .header {
            background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.06);
            padding:0 20px; height:72px; display:flex; align-items:center;
            justify-content:space-between; position:sticky; top:0; z-index:1000;
        }
        .header .logo { font-size:26px; font-weight:800; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .header .logo span { -webkit-text-fill-color:#764ba2; }
        .header .nav-links { display:flex; gap:20px; align-items:center; flex:1; margin-left:30px; }
        .header .nav-links a { color:#555; font-weight:500; font-size:15px; transition:color 0.2s; }
        .header .nav-links a:hover { color:#667eea; }
        .header .nav-links .cart-link { position:relative; font-size:20px; margin-left:auto; }
        .header .nav-links .cart-link .badge {
            position:absolute; top:-8px; right:-12px; background:#e74c3c; color:#fff;
            font-size:11px; border-radius:50%; padding:2px 6px; min-width:18px; text-align:center;
        }
        .header .user-section { display:flex; align-items:center; gap:12px; margin-left:20px; }
        .header .user-info { display:flex; align-items:center; gap:8px; font-weight:500; color:#333; }
        .header .user-info .avatar {
            width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2);
            color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; text-transform:uppercase;
        }
        .header .user-info .username { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .header .btn-logout { background:#e74c3c; color:#fff; border:none; padding:6px 16px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; transition:background 0.2s; }
        .header .btn-logout:hover { background:#c0392b; }
        .header .auth-links { display:flex; gap:10px; align-items:center; }
        .header .auth-links .btn { padding:6px 16px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; transition:all 0.25s; border:none; text-decoration:none; }
        .header .auth-links .btn-outline { background:transparent; border:2px solid #667eea; color:#667eea; }
        .header .auth-links .btn-outline:hover { background:#667eea; color:#fff; }
        .header .auth-links .btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
        .header .auth-links .btn-primary:hover { transform:scale(1.04); box-shadow:0 8px 24px rgba(102,126,234,0.35); }

        /* ===== CHECKOUT ===== */
        .checkout-section {
            background:#fff; border-radius:20px; box-shadow:0 4px 20px rgba(0,0,0,0.04);
            padding:30px; margin:40px 0; border:1px solid #f0f0f0;
        }
        .checkout-section h2 { font-size:28px; font-weight:700; margin-bottom:24px; color:#2d3436; border-bottom:2px solid #f0f0f0; padding-bottom:16px; }
        .checkout-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:30px; }
        @media (max-width:768px) { .checkout-grid { grid-template-columns:1fr; } }

        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-weight:600; margin-bottom:6px; color:#555; font-size:14px; }
        .form-group input, .form-group textarea {
            width:100%; padding:12px 16px; border:2px solid #e0e0e0; border-radius:10px;
            font-size:15px; transition:border-color 0.3s, box-shadow 0.3s;
            background:#fafafa;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color:#667eea; outline:none; background:#fff;
            box-shadow:0 0 0 4px rgba(102,126,234,0.12);
        }
        .form-group textarea { resize:vertical; min-height:80px; }

        .address-list {
            display:flex; flex-direction:column; gap:10px; margin-bottom:18px;
        }
        .address-option {
            display:flex; align-items:center; gap:14px;
            padding:12px 16px; background:#f8f9fa; border-radius:10px;
            border:2px solid transparent; cursor:pointer;
            transition:border-color 0.2s, background 0.2s;
        }
        .address-option:hover { background:#f0f1f5; }
        .address-option.selected {
            border-color:#667eea; background:#eef0ff;
        }
        .address-option input[type="radio"] {
            width:18px; height:18px; flex-shrink:0; cursor:pointer;
        }
        .address-option .info { flex:1; }
        .address-option .info .name { font-weight:600; font-size:16px; }
        .address-option .info .detail { font-size:14px; color:#555; margin-top:2px; }
        .address-option .default-badge {
            background:#667eea; color:#fff; font-size:12px; padding:2px 10px; border-radius:20px;
        }
        .address-option .edit-link {
            color:#667eea; font-size:13px; font-weight:600; cursor:pointer;
            text-decoration:underline; margin-left:8px;
        }
        .address-option .edit-link:hover { color:#5a6fd6; }
        .btn-add-address-small {
            padding:8px 16px; background:transparent; color:#667eea;
            border:2px solid #667eea; border-radius:8px; font-weight:600; font-size:14px;
            cursor:pointer; transition:all 0.2s; display:inline-block;
        }
        .btn-add-address-small:hover { background:#667eea; color:#fff; }

        .cart-summary-box {
            background:#f8f9fa; border-radius:12px; padding:20px;
            border:1px solid #eee;
        }
        .cart-summary-box .item {
            display:flex; gap:14px; padding:12px 0; border-bottom:1px solid #eee;
            align-items:center;
        }
        .cart-summary-box .item:last-child { border-bottom:none; }
        .cart-summary-box .item img {
            width:60px; height:60px; object-fit:contain; background:#fff;
            border-radius:6px; border:1px solid #eee;
        }
        .cart-summary-box .item .info { flex:1; }
        .cart-summary-box .item .info h4 { font-size:15px; font-weight:600; }
        .cart-summary-box .item .info .price { font-weight:700; color:#667eea; font-size:15px; }
        .cart-summary-box .item .info .qty { font-size:13px; color:#888; }
        .cart-summary-box .total-row {
            display:flex; justify-content:space-between; font-weight:700;
            font-size:20px; padding-top:16px; margin-top:16px;
            border-top:2px solid #ddd;
        }
        .cart-summary-box .total-row .total-price { color:#667eea; }

        .btn-checkout-submit {
            width:100%; padding:16px; background:linear-gradient(135deg,#27ae60,#2ecc71);
            color:#fff; border:none; border-radius:40px; font-size:20px;
            font-weight:700; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s;
            margin-top:20px;
        }
        .btn-checkout-submit:hover { transform:scale(1.02); box-shadow:0 8px 28px rgba(46,204,113,0.4); }
        .btn-checkout-submit:disabled { background:#ccc; cursor:not-allowed; transform:none; box-shadow:none; }

        .empty-cart { text-align:center; padding:60px 20px; color:#888; font-size:18px; }
        .empty-cart .icon { font-size:64px; margin-bottom:16px; }
        .empty-cart .btn-shop { display:inline-block; margin-top:16px; padding:12px 36px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border-radius:40px; font-weight:600; transition:transform 0.2s; }
        .empty-cart .btn-shop:hover { transform:scale(1.03); }

        .error-msg { background:#fee; color:#d32f2f; padding:16px; border-radius:10px; text-align:center; margin:20px 0; border:1px solid #f5c6cb; }

        .footer { background:#1a1a2e; color:#ccc; padding:50px 20px 30px; margin-top:60px; }
        .footer-content { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:40px; }
        .footer-content h4 { color:#fff; font-size:18px; margin-bottom:14px; font-weight:600; }
        .footer-content p, .footer-content li { font-size:14px; opacity:0.8; list-style:none; margin-bottom:8px; }
        .footer-bottom { text-align:center; padding-top:24px; border-top:1px solid #2d2d44; margin-top:32px; font-size:14px; opacity:0.7; }

        .toast {
            position:fixed; bottom:30px; right:30px; background:#fff; color:#333; padding:16px 24px;
            border-radius:14px; font-weight:600; font-size:15px; box-shadow:0 8px 32px rgba(0,0,0,0.15);
            z-index:9999; opacity:0; transform:translateY(30px); transition:all 0.4s ease;
            border-left:5px solid #27ae60; max-width:400px; pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.error { border-left-color:#e74c3c; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">My<span>Shop</span></div>
        <div class="nav-links">
            <a href="trangchu.html">Trang chủ</a>
            <a href="trangchu.html">Sản phẩm</a>
            <a href="cart.html" class="cart-link">
                🛒 <span class="badge" id="cartCount">0</span>
            </a>
            <div id="userSection" class="user-section"></div>
        </div>
    </header>

    <div class="container">
        <div class="checkout-section">
            <h2>📦 Thanh toán đơn hàng</h2>
            <div id="checkoutContainer">
                <div class="loading"><div class="spinner"></div>Đang tải giỏ hàng...</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div><h4>MyShop</h4><p>Mua sắm trực tuyến hàng đầu Việt Nam.</p></div>
            <div><h4>Liên kết</h4><ul><li><a href="#">Giới thiệu</a></li><li><a href="#">Chính sách</a></li><li><a href="#">Hỗ trợ</a></li></ul></div>
            <div><h4>Liên hệ</h4><p>Email: support@myshop.vn</p><p>Hotline: 1900 1234</p></div>
        </div>
        <div class="footer-bottom">&copy; 2026 MyShop. All rights reserved.</div>
    </footer>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE_URL = 'https://hoang89computer-be.onrender.com';

        const checkoutContainer = document.getElementById('checkoutContainer');
        const cartCount = document.getElementById('cartCount');
        const userSection = document.getElementById('userSection');
        const toast = document.getElementById('toast');

        let toastTimeout = null;
        let selectedItems = [];
        let totalAmount = 0;
        let addresses = [];
        let selectedAddressId = null;

        function showToast(msg, isError=false) {
            toast.innerHTML = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ========================= TOKEN =========================
        async function refreshAccessToken() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/account/refresh-token`, { method:'POST', credentials:'include' });
                if (!res.ok) throw new Error('Refresh failed');
                const data = await res.json();
                const token = data?.result?.accessToken || data?.accessToken;
                if (token) sessionStorage.setItem('accessToken', token);
                return token;
            } catch(e) { console.error(e); return null; }
        }
        async function getAccessToken() {
            let t = sessionStorage.getItem('accessToken');
            if (!t) t = await refreshAccessToken();
            return t;
        }

        async function fetchData(url, opts={}) {
            let token = await getAccessToken();
            if (!token) throw new Error('Không thể lấy access token. Vui lòng đăng nhập lại.');
            const headers = { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}`, ...(opts.headers||{}) };
            let res = await fetch(url, { ...opts, credentials:'include', headers });
            if (res.status===401 || res.status===403) {
                const newToken = await refreshAccessToken();
                if (newToken) {
                    headers['Authorization'] = `Bearer ${newToken}`;
                    res = await fetch(url, { ...opts, credentials:'include', headers });
                    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.message || e?.result?.message || `HTTP ${res.status}`); }
                    const data = await res.json();
                    return data?.result || data;
                } else {
                    sessionStorage.removeItem('accessToken');
                    window.location.href = 'dang-nhap.html';
                    throw new Error('Phiên đăng nhập hết hạn.');
                }
            }
            if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.message || e?.result?.message || `HTTP ${res.status}`); }
            const data = await res.json();
            return data?.result || data;
        }

        function formatPrice(p) { return new Intl.NumberFormat('vi-VN', { style:'currency', currency:'VND' }).format(p); }

        // ===== Auth & Header =====
        function getUserInfo() {
            try { return JSON.parse(sessionStorage.getItem('accountInfo')); } catch { return null; }
        }
        function renderHeader() {
            const user = getUserInfo();
            if (user?.accountname) {
                const initial = user.accountname.charAt(0).toUpperCase();
                userSection.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${initial}</div>
                        <span class="username">${user.accountname}</span>
                    </div>
                    <button class="btn-logout" id="logoutBtn">Đăng xuất</button>
                `;
                document.getElementById('logoutBtn')?.addEventListener('click', function() {
                    sessionStorage.removeItem('accountInfo');
                    sessionStorage.removeItem('accessToken');
                    localStorage.removeItem('cartCount');
                    window.location.href = 'dang-nhap.html';
                });
            } else {
                userSection.innerHTML = `
                    <div class="auth-links">
                        <a href="dang-nhap.html" class="btn btn-outline">Đăng nhập</a>
                        <a href="dang-ky.html" class="btn btn-primary">Đăng ký</a>
                    </div>
                `;
                window.location.href = 'dang-nhap.html';
            }
        }

        // ===== Render Addresses =====
        function renderAddresses(addresses, selectedId) {
            if (!addresses || addresses.length === 0) {
                return `
                    <div class="form-group">
                        <p style="color:#888; margin-bottom:8px;">Bạn chưa có địa chỉ nào. Hãy thêm địa chỉ mới.</p>
                        <a href="profile.html" class="btn-add-address-small">+ Thêm địa chỉ mới</a>
                    </div>
                `;
            }

            let html = `<div class="address-list">`;
            addresses.forEach(addr => {
                const isSelected = (selectedId === addr.id);
                const defaultBadge = (addr.defaultaddress === 'true' || addr.defaultaddress === true) ? '<span class="default-badge">Mặc định</span>' : '';
                html += `
                    <div class="address-option ${isSelected ? 'selected' : ''}" onclick="selectAddress(${addr.id})">
                        <input type="radio" name="address" value="${addr.id}" ${isSelected ? 'checked' : ''} />
                        <div class="info">
                            <div class="name">${addr.username} ${defaultBadge}</div>
                            <div class="detail">${addr.phone} - ${addr.address}</div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            html += `<a href="profile.html" class="btn-add-address-small" style="margin-top:10px; display:inline-block;">+ Thêm địa chỉ mới</a>`;
            return html;
        }

        window.selectAddress = function(id) {
            selectedAddressId = id;
            document.querySelectorAll('.address-option').forEach(el => {
                const radio = el.querySelector('input[type="radio"]');
                if (radio && parseInt(radio.value) === id) {
                    el.classList.add('selected');
                    radio.checked = true;
                } else {
                    el.classList.remove('selected');
                }
            });
        };

        // ===== Render Checkout =====
        function renderCheckout(items, addrData) {
            if (!items?.length) {
                checkoutContainer.innerHTML = `
                    <div class="empty-cart">
                        <div class="icon">🛒</div>
                        <p>Không có sản phẩm nào được chọn để thanh toán.</p>
                        <a href="cart.html" class="btn-shop">Quay lại giỏ hàng</a>
                    </div>
                `;
                return;
            }

            selectedItems = items;
            totalAmount = items.reduce((sum, item) => sum + (item.products.price * item.quality), 0);

            if (addrData && addrData.length > 0) {
                const defaultAddr = addrData.find(a => a.defaultaddress === 'true' || a.defaultaddress === true);
                if (defaultAddr) {
                    selectedAddressId = defaultAddr.id;
                } else {
                    selectedAddressId = addrData[0].id;
                }
            }

            const addressHtml = renderAddresses(addrData, selectedAddressId);

            let html = `
                <div class="checkout-grid">
                    <div>
                        <h3 style="margin-bottom:16px;">Thông tin giao hàng</h3>
                        <div class="form-group">
                            <label>Chọn địa chỉ nhận hàng</label>
                            ${addressHtml}
                        </div>
                        <div class="form-group">
                            <label for="note">Ghi chú (tùy chọn)</label>
                            <textarea id="note" placeholder="Yêu cầu đặc biệt (nếu có)"></textarea>
                        </div>
                        <button class="btn-checkout-submit" id="placeOrderBtn">Đặt hàng</button>
                    </div>
                    <div>
                        <h3 style="margin-bottom:16px;">Tóm tắt đơn hàng</h3>
                        <div class="cart-summary-box">
                            ${items.map(item => `
                                <div class="item">
                                    <img src="${item.products.image || ''}" alt="${item.products.nameProduct}" />
                                    <div class="info">
                                        <h4>${item.products.nameProduct}</h4>
                                        <div class="price">${formatPrice(item.products.price)}</div>
                                        <div class="qty">Số lượng: ${item.quality}</div>
                                    </div>
                                </div>
                            `).join('')}
                            <div class="total-row">
                                <span>Tổng cộng</span>
                                <span class="total-price">${formatPrice(totalAmount)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            checkoutContainer.innerHTML = html;

            document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);
        }

        // ===== Place Order (chỉ tạo đơn hàng, không xóa cart, không VNPay) =====
        async function placeOrder() {
            if (!selectedAddressId) {
                showToast('Vui lòng chọn địa chỉ nhận hàng.', true);
                return;
            }

            try {
                const orderItems = selectedItems.map(item => ({
                    productId: item.products.id,
                    quantity: item.quality
                }));

                const orderData = {
                    AddressesId: selectedAddressId,
                    orderItems: orderItems
                };

                const btn = document.getElementById('placeOrderBtn');
                btn.disabled = true;
                btn.textContent = 'Đang xử lý...';

                // Gọi API tạo đơn hàng
                const orderResult = await fetchData(`${API_BASE_URL}/api/orders/create`, {
                    method: 'POST',
                    body: JSON.stringify(orderData)
                });

                // Kiểm tra response thành công (code 1000 hoặc message thành công)
                const isSuccess = (orderResult?.code === 1000) || 
                                  (orderResult?.message && orderResult.message.toLowerCase().includes('success'));

                if (isSuccess) {
                    showToast('✅ Đặt hàng thành công! Cảm ơn bạn đã mua sắm.', false);
                    // Chuyển về trang chủ sau 2.5 giây
                    setTimeout(() => {
                        window.location.href = 'trangchu.html';
                    }, 2500);
                } else {
                    throw new Error(orderResult?.message || 'Đặt hàng thất bại, vui lòng thử lại.');
                }

            } catch (error) {
                showToast(`❌ ${error.message}`, true);
                const btn = document.getElementById('placeOrderBtn');
                btn.disabled = false;
                btn.textContent = 'Đặt hàng';
            }
        }

        // ===== Load Checkout =====
        async function loadCheckout() {
            try {
                const addrData = await fetchData(`${API_BASE_URL}/api/useraddresses/user`);
                addresses = addrData || [];

                const stored = sessionStorage.getItem('selectedCartItems');
                if (!stored) {
                    checkoutContainer.innerHTML = `
                        <div class="empty-cart">
                            <div class="icon">🛒</div>
                            <p>Không có sản phẩm nào được chọn để thanh toán.</p>
                            <a href="cart.html" class="btn-shop">Quay lại giỏ hàng</a>
                        </div>
                    `;
                    return;
                }
                const items = JSON.parse(stored);
                selectedItems = items;
                let total = items.reduce((s,item) => s + item.quality, 0);
                localStorage.setItem('cartCount', total);
                cartCount.textContent = total;
                renderCheckout(items, addresses);
            } catch(e) {
                checkoutContainer.innerHTML = `<div class="error-msg">❌ ${e.message}</div>`;
                console.error(e);
            }
        }

        // ===== INIT =====
        async function init() {
            renderHeader();
            await getAccessToken();
            loadCheckout();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
